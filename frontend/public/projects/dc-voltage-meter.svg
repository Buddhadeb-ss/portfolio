<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="grid-pattern-4" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#262933" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#0b0c10" />
  <rect width="800" height="500" fill="url(#grid-pattern-4)" />

  <!-- Outer Blueprint Border -->
  <rect x="24" y="24" width="752" height="452" fill="none" stroke="#232733" stroke-width="1.5" />
  <rect x="32" y="32" width="736" height="436" fill="none" stroke="#181a24" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Corner Marks -->
  <path d="M18 24 h12 M24 18 v12 M770 24 h12 M776 18 v12 M18 476 h12 M24 470 v12 M770 476 h12 M776 470 v12" stroke="#4a5061" stroke-width="1.5" />

  <!-- Header Technical Silkscreen -->
  <text x="44" y="52" font-family="'JetBrains Mono', monospace" font-size="11" fill="#717789" letter-spacing="2">MOD_04 // POWER_INSTRUMENTATION</text>
  <text x="756" y="52" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#717789" letter-spacing="1">INA219 // 0.8mA_RES</text>

  <!-- Footer Technical Silkscreen -->
  <text x="44" y="456" font-family="'JetBrains Mono', monospace" font-size="10" fill="#525866" letter-spacing="1.5">RANGE: 0-26V // ±3.2A</text>
  <text x="756" y="456" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#525866" letter-spacing="1.5">TELEMETRY: 10Hz // WI-FI</text>

  <!-- Center Instrument Meter Enclosure -->
  <g transform="translate(200, 105)">
    <!-- Chassis Body -->
    <rect x="0" y="0" width="400" height="260" rx="10" fill="#11131c" stroke="#363d50" stroke-width="2" />
    <rect x="10" y="10" width="380" height="240" rx="6" fill="#090b12" stroke="#222634" stroke-width="1.2" />

    <!-- Digital Segment Readout Bezel -->
    <rect x="35" y="30" width="330" height="110" rx="4" fill="#04060a" stroke="#2e3546" stroke-width="1.5" />

    <!-- Voltage Digital Readout -->
    <text x="60" y="75" font-family="'JetBrains Mono', monospace" font-size="28" fill="#ffffff" font-weight="700" letter-spacing="2">24.18<tspan font-size="16" fill="#717789"> V</tspan></text>
    <text x="60" y="100" font-family="'JetBrains Mono', monospace" font-size="10" fill="#525866">DC VOLTAGE BUS</text>

    <!-- Current Digital Readout -->
    <text x="240" y="75" font-family="'JetBrains Mono', monospace" font-size="28" fill="#ffffff" font-weight="700" letter-spacing="2">02.45<tspan font-size="16" fill="#717789"> A</tspan></text>
    <text x="240" y="100" font-family="'JetBrains Mono', monospace" font-size="10" fill="#525866">HIGH-SIDE SHUNT</text>

    <!-- Power Bar Graph Level -->
    <g transform="translate(35, 155)">
      <text x="0" y="12" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8892a6">POWER: 59.24 W [P = V × I]</text>
      <rect x="0" y="20" width="330" height="12" rx="2" fill="#151822" stroke="#2c3344" stroke-width="1" />
      <rect x="2" y="22" width="225" height="8" rx="1" fill="#e4e7ee" />
    </g>

    <!-- Shunt Circuit Symbol Schematic Below -->
    <g transform="translate(60, 215)">
      <circle cx="0" cy="8" r="4" fill="#11131c" stroke="#8892a6" stroke-width="1.5" />
      <text x="-16" y="11" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ffffff" font-weight="600">+</text>
      <line x1="5" y1="8" x2="60" y2="8" stroke="#8892a6" stroke-width="1.5" />
      
      <!-- Resistor Zigzag -->
      <path d="M60 8 l5 -6 l10 12 l10 -12 l10 12 l10 -12 l10 12 l5 -6" fill="none" stroke="#ffffff" stroke-width="2" />
      <text x="75" y="-3" font-family="'JetBrains Mono', monospace" font-size="8" fill="#717789">R_SHUNT 0.1Ω</text>

      <line x1="120" y1="8" x2="180" y2="8" stroke="#8892a6" stroke-width="1.5" />
      <circle cx="185" cy="8" r="4" fill="#11131c" stroke="#8892a6" stroke-width="1.5" />
      <text x="195" y="11" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ffffff" font-weight="600">-</text>
      <text x="215" y="11" font-family="'JetBrains Mono', monospace" font-size="9" fill="#717789">LOAD: RES_BANK</text>
    </g>
  </g>

  <!-- Left Side: INA219 Specs -->
  <g transform="translate(60, 165)" font-family="'JetBrains Mono', monospace" font-size="8" fill="#717789">
    <rect x="0" y="0" width="105" height="90" fill="#10121a" stroke="#252936" stroke-width="1.2" />
    <text x="12" y="20" fill="#9da6b9" font-weight="600">INA219 SENSOR</text>
    <line x1="12" y1="28" x2="93" y2="28" stroke="#252936" stroke-width="1" />
    <text x="12" y="44" fill="#5e6475">I2C: 0x40 ADDR</text>
    <text x="12" y="60" fill="#5e6475">CAL: 4096 REG</text>
    <text x="12" y="76" fill="#a1a8b8">PRECISION: 0.1%</text>
  </g>

  <!-- Right Side: Telemetry Specs -->
  <g transform="translate(635, 175)" font-family="'JetBrains Mono', monospace" font-size="8" fill="#717789">
    <rect x="0" y="0" width="105" height="85" fill="#10121a" stroke="#252936" stroke-width="1.2" />
    <text x="12" y="20" fill="#9da6b9" font-weight="600">WI-FI STREAM</text>
    <line x1="12" y1="28" x2="93" y2="28" stroke="#252936" stroke-width="1" />
    <text x="12" y="44" fill="#5e6475">RATE: 10 HZ</text>
    <text x="12" y="60" fill="#5e6475">BLYNK CLOUD</text>
    <text x="12" y="76" fill="#a1a8b8">LOSS: 0.0%</text>
  </g>
</svg>
