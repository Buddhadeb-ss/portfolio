<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="grid-pattern-1" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#262933" />
    </pattern>
    <radialGradient id="sensor-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#0b0c10" />
  <rect width="800" height="500" fill="url(#grid-pattern-1)" />

  <!-- Outer Blueprint Border -->
  <rect x="24" y="24" width="752" height="452" fill="none" stroke="#232733" stroke-width="1.5" />
  <rect x="32" y="32" width="736" height="436" fill="none" stroke="#181a24" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Corner Registration Marks -->
  <path d="M18 24 h12 M24 18 v12 M770 24 h12 M776 18 v12 M18 476 h12 M24 470 v12 M770 476 h12 M776 470 v12" stroke="#4a5061" stroke-width="1.5" />

  <!-- Header Technical Silkscreen -->
  <text x="44" y="52" font-family="'JetBrains Mono', monospace" font-size="11" fill="#717789" letter-spacing="2">MOD_01 // EDGE_VISION_AI</text>
  <text x="756" y="52" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#717789" letter-spacing="1">XTENSA_LX6 // 240MHz</text>

  <!-- Footer Technical Silkscreen -->
  <text x="44" y="456" font-family="'JetBrains Mono', monospace" font-size="10" fill="#525866" letter-spacing="1.5">TFLM_INT8 // 14.8KB CORE</text>
  <text x="756" y="456" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#525866" letter-spacing="1.5">LATENCY: 141MS // 0-LEAK</text>

  <!-- Center Artwork: Camera Sensor & Neural Tracking Reticle -->
  <circle cx="400" cy="245" r="140" fill="url(#sensor-glow)" />
  <circle cx="400" cy="245" r="130" fill="none" stroke="#2d3342" stroke-width="1.5" stroke-dasharray="3 3" />
  <circle cx="400" cy="245" r="105" fill="none" stroke="#3e4557" stroke-width="1.5" />
  <circle cx="400" cy="245" r="75" fill="none" stroke="#252936" stroke-width="2" />
  <circle cx="400" cy="245" r="42" fill="#13161f" stroke="#52596d" stroke-width="1.5" />
  <circle cx="400" cy="245" r="18" fill="#1d222e" stroke="#858fa6" stroke-width="2" />
  <circle cx="400" cy="245" r="6" fill="#e4e7ee" />

  <!-- Sensor Frame Graticule -->
  <line x1="230" y1="245" x2="350" y2="245" stroke="#333949" stroke-width="1.5" />
  <line x1="450" y1="245" x2="570" y2="245" stroke="#333949" stroke-width="1.5" />
  <line x1="400" y1="85" x2="400" y2="195" stroke="#333949" stroke-width="1.5" />
  <line x1="400" y1="295" x2="400" y2="405" stroke="#333949" stroke-width="1.5" />

  <!-- Lens Aperture Ticks (Angular) -->
  <line x1="400" y1="110" x2="400" y2="120" stroke="#717789" stroke-width="2" />
  <line x1="400" y1="370" x2="400" y2="380" stroke="#717789" stroke-width="2" />
  <line x1="265" y1="245" x2="275" y2="245" stroke="#717789" stroke-width="2" />
  <line x1="525" y1="245" x2="535" y2="245" stroke="#717789" stroke-width="2" />

  <!-- Bounding Box / Neural Object Recognition Bracket -->
  <g transform="translate(310, 165)">
    <!-- Target Bounding Box -->
    <rect x="0" y="0" width="180" height="150" fill="none" stroke="#e4e7ee" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.85" />
    <!-- Sharp Corner Brackets -->
    <path d="M0 20 V0 H20 M160 0 H180 V20 M180 130 V150 H160 M20 150 H0 V130" fill="none" stroke="#ffffff" stroke-width="3" />
    <!-- HUD Annotation Tag -->
    <rect x="0" y="-22" width="135" height="18" fill="#1b1e28" stroke="#404657" stroke-width="1" />
    <text x="8" y="-9" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ffffff" font-weight="600">OV3660: LOCK 98.4%</text>
    <!-- Vector Tracking Arrow -->
    <line x1="90" y1="75" x2="135" y2="45" stroke="#a1a8b8" stroke-width="1.5" />
    <circle cx="135" cy="45" r="3" fill="#ffffff" />
  </g>

  <!-- Left Side: Serial & Sensor Pins Blueprint -->
  <g transform="translate(60, 140)" font-family="'JetBrains Mono', monospace" font-size="9" fill="#717789">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#252a36" stroke-width="1.5" />
    <circle cx="50" cy="0" r="2.5" fill="#52596d" />
    <text x="60" y="3">GPIO_04 [FLASH]</text>

    <line x1="0" y1="35" x2="50" y2="35" stroke="#252a36" stroke-width="1.5" />
    <circle cx="50" cy="35" r="2.5" fill="#52596d" />
    <text x="60" y="38">GPIO_22 [PCLK]</text>

    <line x1="0" y1="70" x2="50" y2="70" stroke="#252a36" stroke-width="1.5" />
    <circle cx="50" cy="70" r="2.5" fill="#52596d" />
    <text x="60" y="73">GPIO_26 [SCCB_SDA]</text>

    <line x1="0" y1="105" x2="50" y2="105" stroke="#252a36" stroke-width="1.5" />
    <circle cx="50" cy="105" r="2.5" fill="#52596d" />
    <text x="60" y="108">GPIO_27 [SCCB_SCL]</text>
  </g>

  <!-- Right Side: Neural Kernel Matrix Blueprint -->
  <g transform="translate(630, 160)" font-family="'JetBrains Mono', monospace" font-size="9" fill="#717789">
    <rect x="0" y="0" width="105" height="110" fill="#10121a" stroke="#252936" stroke-width="1.2" />
    <text x="12" y="22" fill="#9da6b9" font-weight="600">ESP-NN INT8</text>
    <line x1="12" y1="32" x2="93" y2="32" stroke="#252936" stroke-width="1" />
    <text x="12" y="48" fill="#5e6475">CONV2D 3x3</text>
    <text x="12" y="66" fill="#5e6475">DEPTHWISE</text>
    <text x="12" y="84" fill="#5e6475">RELU6 // MAX</text>
    <text x="12" y="100" fill="#a1a8b8">FPS: 7.14</text>
  </g>
</svg>
