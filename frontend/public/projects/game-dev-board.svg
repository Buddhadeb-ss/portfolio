<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="grid-pattern-3" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#262933" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#0b0c10" />
  <rect width="800" height="500" fill="url(#grid-pattern-3)" />

  <!-- Outer Blueprint Border -->
  <rect x="24" y="24" width="752" height="452" fill="none" stroke="#232733" stroke-width="1.5" />
  <rect x="32" y="32" width="736" height="436" fill="none" stroke="#181a24" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Corner Marks -->
  <path d="M18 24 h12 M24 18 v12 M770 24 h12 M776 18 v12 M18 476 h12 M24 470 v12 M770 476 h12 M776 470 v12" stroke="#4a5061" stroke-width="1.5" />

  <!-- Header Technical Silkscreen -->
  <text x="44" y="52" font-family="'JetBrains Mono', monospace" font-size="11" fill="#717789" letter-spacing="2">MOD_03 // KICAD_PCB_LAYOUT</text>
  <text x="756" y="52" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#717789" letter-spacing="1">NANO_ESP32 // S3_SOC</text>

  <!-- Footer Technical Silkscreen -->
  <text x="44" y="456" font-family="'JetBrains Mono', monospace" font-size="10" fill="#525866" letter-spacing="1.5">2-LAYER FR-4 // 10MIL TRACES</text>
  <text x="756" y="456" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#525866" letter-spacing="1.5">I2C_400KHZ // GPIO_MATRIX</text>

  <!-- Center PCB Board Contour (Rounded Handheld Shape) -->
  <g transform="translate(180, 110)">
    <!-- PCB Substrate Outline with Corner Mounting Holes -->
    <rect x="0" y="0" width="440" height="260" rx="24" fill="#12141c" stroke="#353c4d" stroke-width="2" />
    <rect x="12" y="12" width="416" height="236" rx="16" fill="none" stroke="#252a36" stroke-width="1" stroke-dasharray="2 3" />

    <!-- Corner Mounting Holes with Solder Rings -->
    <circle cx="24" cy="24" r="8" fill="#0b0c10" stroke="#52596d" stroke-width="1.5" />
    <circle cx="416" cy="24" r="8" fill="#0b0c10" stroke="#52596d" stroke-width="1.5" />
    <circle cx="24" cy="236" r="8" fill="#0b0c10" stroke="#52596d" stroke-width="1.5" />
    <circle cx="416" cy="236" r="8" fill="#0b0c10" stroke="#52596d" stroke-width="1.5" />

    <!-- Centered 0.96" OLED Display Frame -->
    <g transform="translate(145, 55)">
      <rect x="0" y="0" width="150" height="100" rx="4" fill="#07090f" stroke="#485166" stroke-width="1.8" />
      <rect x="10" y="10" width="130" height="80" rx="2" fill="#0c1017" stroke="#2b3140" stroke-width="1" />
      <!-- Pixel Text Screen Mockup -->
      <text x="75" y="38" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#e4e7ee" font-weight="600">RETRO_GAME v1</text>
      <text x="75" y="56" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#717789">SCORE: 04280</text>
      <text x="75" y="74" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#52596d">60 FPS // BUFFERED</text>
      <!-- Display Header Pinout Solder Pads -->
      <circle cx="45" cy="-8" r="3.5" fill="#52596d" stroke="#8a94aa" stroke-width="1" />
      <circle cx="65" cy="-8" r="3.5" fill="#52596d" stroke="#8a94aa" stroke-width="1" />
      <circle cx="85" cy="-8" r="3.5" fill="#52596d" stroke="#8a94aa" stroke-width="1" />
      <circle cx="105" cy="-8" r="3.5" fill="#52596d" stroke="#8a94aa" stroke-width="1" />
    </g>

    <!-- Left Side: D-Pad Tactile Push-Buttons -->
    <g transform="translate(70, 110)">
      <!-- Cross Shape D-Pad Frame -->
      <rect x="-35" y="-12" width="70" height="24" rx="4" fill="#1b1e28" stroke="#4a5368" stroke-width="1.5" />
      <rect x="-12" y="-35" width="24" height="70" rx="4" fill="#1b1e28" stroke="#4a5368" stroke-width="1.5" />
      <circle cx="0" cy="0" r="6" fill="#07090f" />
      <path d="M0 -22 L-4 -16 H4 Z M0 22 L-4 16 H4 Z M-22 0 L-16 -4 V4 Z M22 0 L16 -4 V4 Z" fill="#8a94aa" />
    </g>

    <!-- Right Side: Action Buttons (A / B) -->
    <g transform="translate(360, 110)">
      <!-- Button B -->
      <circle cx="-22" cy="14" r="14" fill="#1b1e28" stroke="#4a5368" stroke-width="1.5" />
      <text x="-22" y="18" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ffffff" font-weight="600">B</text>
      <!-- Button A -->
      <circle cx="16" cy="-14" r="14" fill="#1b1e28" stroke="#4a5368" stroke-width="1.5" />
      <text x="16" y="-10" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ffffff" font-weight="600">A</text>
    </g>

    <!-- Center Bottom: START / SELECT Buttons -->
    <g transform="translate(195, 205)">
      <rect x="0" y="0" width="22" height="7" rx="3.5" fill="#2d3342" stroke="#52596d" stroke-width="1" />
      <text x="11" y="19" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7" fill="#717789">SELECT</text>
      <rect x="35" y="0" width="22" height="7" rx="3.5" fill="#2d3342" stroke="#52596d" stroke-width="1" />
      <text x="46" y="19" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7" fill="#717789">START</text>
    </g>

    <!-- PCB Traces (45-degree chamfered copper tracks) -->
    <path d="M95 110 h30 l20 -30 h10" fill="none" stroke="#3b4457" stroke-width="1.5" />
    <path d="M95 125 h20 l35 40 h15" fill="none" stroke="#3b4457" stroke-width="1.5" />
    <path d="M335 110 h-25 l-20 40 h-10" fill="none" stroke="#3b4457" stroke-width="1.5" />
    <path d="M375 90 v-20 l-40 -40 h-80" fill="none" stroke="#3b4457" stroke-width="1.5" />

    <!-- Via Stitching Rings -->
    <circle cx="145" cy="80" r="2.5" fill="#0b0c10" stroke="#717789" stroke-width="1" />
    <circle cx="165" cy="165" r="2.5" fill="#0b0c10" stroke="#717789" stroke-width="1" />
    <circle cx="280" cy="150" r="2.5" fill="#0b0c10" stroke="#717789" stroke-width="1" />
  </g>

  <!-- Left Side: KiCad Fab Stackup Spec -->
  <g transform="translate(60, 165)" font-family="'JetBrains Mono', monospace" font-size="8" fill="#717789">
    <rect x="0" y="0" width="105" height="95" fill="#10121a" stroke="#252936" stroke-width="1.2" />
    <text x="12" y="20" fill="#9da6b9" font-weight="600">PCB STACKUP</text>
    <line x1="12" y1="28" x2="93" y2="28" stroke="#252936" stroke-width="1" />
    <text x="12" y="44" fill="#5e6475">L1: TOP_COPPER</text>
    <text x="12" y="60" fill="#5e6475">CORE: 1.6mm FR-4</text>
    <text x="12" y="76" fill="#5e6475">L2: BOT_GROUND</text>
    <text x="12" y="90" fill="#a1a8b8">FINISH: ENIG</text>
  </g>
</svg>
