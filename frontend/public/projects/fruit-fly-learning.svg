    <!-- Motor Efferent Nodes (Right, High Contrast Target) -->
    <g fill="#ffffff" stroke="#ffffff">
      <circle cx="390" cy="80" r="8" />
      <circle cx="390" cy="140" r="8" />
      <circle cx="390" cy="200" r="8" />
    </g>

    <!-- Graph Column Header Labels -->
    <text x="50" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#717789">48 SENSORY</text>
    <text x="240" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#717789">144 INTRINSIC SYNAPSES</text>
    <text x="390" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e4e7ee">24 MOTOR</text>
  </g>

  <!-- Left Side: Biology Stats -->
  <g transform="translate(60, 165)" font-family="'JetBrains Mono', monospace" font-size="8" fill="#717789">
    <rect x="0" y="0" width="105" height="95" fill="#10121a" stroke="#252936" stroke-width="1.2" />
    <text x="12" y="20" fill="#9da6b9" font-weight="600">CONNECTOME</text>
    <line x1="12" y1="28" x2="93" y2="28" stroke="#252936" stroke-width="1" />
    <text x="12" y="44" fill="#5e6475">FAFB EM MAP</text>
    <text x="12" y="60" fill="#5e6475">SPARSE TENSOR</text>
    <text x="12" y="76" fill="#5e6475">PYTORCH RECUR</text>
    <text x="12" y="90" fill="#a1a8b8">SYN: 14,037</text>
  </g>

  <!-- Right Side: A2C RL Training Metrics -->
  <g transform="translate(635, 175)" font-family="'JetBrains Mono', monospace" font-size="8" fill="#717789">
    <rect x="0" y="0" width="105" height="85" fill="#10121a" stroke="#252936" stroke-width="1.2" />
    <text x="12" y="20" fill="#9da6b9" font-weight="600">A2C TRAINING</text>
    <line x1="12" y1="28" x2="93" y2="28" stroke="#252936" stroke-width="1" />
    <text x="12" y="44" fill="#5e6475">DISCOUNT: 0.99</text>
    <text x="12" y="60" fill="#5e6475">ENTROPY: 0.01</text>
    <text x="12" y="76" fill="#a1a8b8">TARGET: SURVIVE</text>
