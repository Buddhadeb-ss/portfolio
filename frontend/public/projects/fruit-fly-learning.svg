<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="grid-pattern-6" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#262933" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#0b0c10" />
  <rect width="800" height="500" fill="url(#grid-pattern-6)" />

  <!-- Outer Blueprint Border -->
  <rect x="24" y="24" width="752" height="452" fill="none" stroke="#232733" stroke-width="1.5" />
  <rect x="32" y="32" width="736" height="436" fill="none" stroke="#181a24" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Corner Marks -->
  <path d="M18 24 h12 M24 18 v12 M770 24 h12 M776 18 v12 M18 476 h12 M24 470 v12 M770 476 h12 M776 470 v12" stroke="#4a5061" stroke-width="1.5" />

  <!-- Header Technical Silkscreen -->
  <text x="44" y="52" font-family="'JetBrains Mono', monospace" font-size="11" fill="#717789" letter-spacing="2">MOD_06 // CONNECTOME_NEURAL_SIM</text>
  <text x="756" y="52" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#717789" letter-spacing="1">DROSOPHILA // 14,037_SYNAPSES</text>

  <!-- Footer Technical Silkscreen -->
  <text x="44" y="456" font-family="'JetBrains Mono', monospace" font-size="10" fill="#525866" letter-spacing="1.5">216 BIOLOGICAL NEURONS</text>
  <text x="756" y="456" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#525866" letter-spacing="1.5">ALGO: A2C_RL // STEP: &lt;5MS</text>

  <!-- Center Artwork: Biological Connectome Synaptic Graph Network -->
  <g transform="translate(180, 100)">
    <!-- Container Outline -->
    <rect x="0" y="0" width="440" height="270" rx="8" fill="#10131d" stroke="#333a4c" stroke-width="1.8" />
    <rect x="8" y="8" width="424" height="254" rx="4" fill="#080a11" stroke="#1f2330" stroke-width="1" />

    <!-- Connectome Neural Network Graph -->
    <!-- Synaptic Directed Edges (Delicate Gray Interconnect Lines) -->
    <g stroke="#353e52" stroke-width="1" opacity="0.8">
      <!-- Input to Intrinsic -->
      <line x1="50" y1="50" x2="160" y2="80" />
      <line x1="50" y1="50" x2="220" y2="50" />
      <line x1="50" y1="100" x2="160" y2="80" />
      <line x1="50" y1="100" x2="180" y2="150" />
      <line x1="50" y1="150" x2="180" y2="150" />
      <line x1="50" y1="150" x2="230" y2="200" />
      <line x1="50" y1="200" x2="230" y2="200" />
      <line x1="50" y1="200" x2="170" y2="220" />

      <!-- Intrinsic Recurrent Mesh -->
      <line x1="160" y1="80" x2="220" y2="50" stroke="#525f7a" stroke-width="1.2" />
      <line x1="160" y1="80" x2="240" y2="110" />
      <line x1="220" y1="50" x2="280" y2="70" />
      <line x1="240" y1="110" x2="180" y2="150" />
      <line x1="180" y1="150" x2="260" y2="160" stroke="#525f7a" stroke-width="1.2" />
      <line x1="260" y1="160" x2="230" y2="200" />
      <line x1="240" y1="110" x2="260" y2="160" />
      <line x1="280" y1="70" x2="260" y2="160" stroke="#687799" stroke-width="1.4" />
      <line x1="280" y1="70" x2="330" y2="100" />
      <line x1="260" y1="160" x2="330" y2="160" stroke="#687799" stroke-width="1.4" />
      <line x1="230" y1="200" x2="320" y2="210" />

      <!-- Intrinsic to Motor Efferent Output -->
      <line x1="330" y1="100" x2="390" y2="80" stroke="#8898bf" stroke-width="1.5" />
      <line x1="330" y1="100" x2="390" y2="140" />
      <line x1="330" y1="160" x2="390" y2="140" stroke="#8898bf" stroke-width="1.5" />
      <line x1="330" y1="160" x2="390" y2="200" stroke="#8898bf" stroke-width="1.5" />
      <line x1="320" y1="210" x2="390" y2="200" />
    </g>

    <!-- Sensory Input Nodes (Left) -->
    <g fill="#181c29" stroke="#717789" stroke-width="1.5">
      <circle cx="50" cy="50" r="7" />
      <circle cx="50" cy="100" r="7" />
      <circle cx="50" cy="150" r="7" />
      <circle cx="50" cy="200" r="7" />
    </g>

    <!-- Intrinsic Interneuron Nodes (Center) -->
    <g fill="#212738" stroke="#a0abbf" stroke-width="1.8">
      <circle cx="160" cy="80" r="9" />
      <circle cx="220" cy="50" r="8" />
      <circle cx="240" cy="110" r="11" fill="#2d354d" stroke="#ffffff" />
      <circle cx="180" cy="150" r="9" />
      <circle cx="260" cy="160" r="12" fill="#2d354d" stroke="#ffffff" />
      <circle cx="280" cy="70" r="10" />
      <circle cx="230" cy="200" r="8" />
      <circle cx="170" cy="220" r="7" />
      <circle cx="330" cy="100" r="9" />
      <circle cx="330" cy="160" r="10" />
      <circle cx="320" cy="210" r="7" />
